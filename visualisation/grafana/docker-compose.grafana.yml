# Grafana for the PAM anomaly dashboard, with the Infinity datasource plugin
# pre-installed and the datasource + dashboard provisioned from ./provisioning.
#
#   PAM_API_URL=http://host.docker.internal:8000 \
#     docker compose -f visualisation/grafana/docker-compose.grafana.yml up -d
#
# Joins the same external Wazuh network as api/docker-compose.yml so it can reach
# the scoring service as http://pam-scoring:8000. If your API runs on the host
# instead, set PAM_API_URL=http://host.docker.internal:8000.
#
# NOTE: this stands up a SEPARATE Grafana (port 3001 to avoid clashing with an
# existing Grafana already on 3000). Point it at 3000 only if that Grafana is
# free.
services:
  grafana:
    image: grafana/grafana:11.2.0
    container_name: pam-grafana
    restart: unless-stopped
    environment:
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource"
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: "dark"
      # Passed through to the provisioned datasource base URL.
      PAM_API_URL: "${PAM_API_URL:-http://pam-scoring:8000}"
    ports:
      - "3001:3000"
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - pam_grafana_data:/var/lib/grafana
    networks:
      - wazuh

volumes:
  pam_grafana_data:

networks:
  wazuh:
    external: true
    name: single-node_default
