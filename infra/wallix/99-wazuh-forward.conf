# 99-wazuh-forward.conf
# =====================================================================
# syslog-ng drop-in ON THE WALLIX BASTION APPLIANCE:
#   /etc/syslog-ng/conf.d/99-wazuh-forward.conf
#
# Forwards the appliance OS log source (s_src) to the Wazuh manager over
# UDP/514. This is the MANUAL forwarding path (appliance OS events);
# structured session telemetry (KBD_INPUT, SESSION_*) comes separately via
# System > SIEM Integration. See CLAUDE.md sections 3, 4, 15.
#
# ---------------------------------------------------------------------
# REFERENCE RECONSTRUCTION -- NOT a byte-copy of the live file.
# The authoritative copy lives on the WALLIX VM (it is not in this repo).
# After deploying, diff this against the appliance and replace if it differs:
#   sudo diff /etc/syslog-ng/conf.d/99-wazuh-forward.conf 99-wazuh-forward.conf
# ---------------------------------------------------------------------
#
# GOTCHAS (learned the hard way -- CLAUDE.md section 3.5):
#   * Block delimiters are BRACES:  log { ... };   NOT  log ( ... )
#     One wrong char killed syslog-ng and stopped ALL forwarding, including
#     the native SIEM path. Validate before trusting it:
#         sudo /usr/sbin/syslog-ng --syntax-only
#     then restart:
#         sudo systemctl restart syslog-ng
#   * <WAZUH_HOST_IP> = the Docker host running the Wazuh stack (the machine's
#     LAN IP, e.g. 192.168.1.32). NOT localhost, NOT the container IP.
#   * The host needs an inbound UDP/514 firewall allow rule.
#
# NOTE: this OS-log forward floods Wazuh with sudo/sshd/cron noise and the
# GUI audit poll. Trim or disable it before dataset generation so it does not
# pollute the ML features (CLAUDE.md section 4.2 / 15.3). Session telemetry
# arrives via SIEM Integration regardless of this file.

destination d_wazuh {
    network(
        "<WAZUH_HOST_IP>"
        transport("udp")
        port(514)
    );
};

log {
    source(s_src);
    destination(d_wazuh);
};

# Legacy syslog-ng equivalent of the destination above, if `network(...)` is
# unavailable on this appliance's syslog-ng version:
#
# destination d_wazuh {
#     udp("<WAZUH_HOST_IP>" port(514));
# };
