# Scoring service, attached to the existing Wazuh stack's network so it can
# reach the indexer by service name.
#
#   docker compose -f api/docker-compose.yml up -d --build
#
# The Wazuh stack is a SEPARATE compose project (wazuh-docker/single-node), so
# its network is joined as external rather than redefined here -- redefining it
# would create a second, unconnected bridge with a similar name.
#
# NO PORTS ARE PUBLISHED. /score has no authentication (auth.py is Security-owned
# and unbuilt), and it returns privileged session content. Reach it from inside
# the network, or publish to 127.0.0.1 only for a local demo.

services:
  scoring:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: pam-scoring:1.0
    container_name: pam-scoring
    restart: unless-stopped
    environment:
      BUNDLE_PATH: /app/ml/bundles/isolationforest.joblib
    networks:
      - wazuh
    # Local demo only. Remove before anything resembling production.
    ports:
      - "127.0.0.1:8000:8000"

networks:
  wazuh:
    external: true
    name: single-node_default
